name: Update Ubuntu ISO Information

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specify a specific Ubuntu version to update (e.g., 26.10)'
        required: false
        type: string

jobs:
  update-iso-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch checksums
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            VERSION_FILES="config/versions/$VERSION.yaml"
          else
            VERSION_FILES=$(ls config/versions/*.yaml)
          fi

          for CONFIG_FILE in $VERSION_FILES; do
            echo "Processing $CONFIG_FILE..."
            python3 scripts/fetch_checksums.py -v --config "$CONFIG_FILE" || echo "Warning: Failed to process $CONFIG_FILE"
          done

      - name: Regenerate JSON
        run: |
          python3 scripts/generate_iso_json.py --output-dir output/
          python3 scripts/validate_json.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Ubuntu ISO information
          branch: auto-update-iso-info
          delete-branch: true
          title: "Auto: Update Ubuntu ISO information"
          body: |
            This is an automated PR created by the GitHub Actions workflow to update Ubuntu ISO information.

            The workflow has:
            1. Fetched SHA256 checksums from Ubuntu's published SHA256SUMS files
            2. Fetched ISO sizes via HEAD requests
            3. Updated the YAML configuration and regenerated the JSON output

            Please review the changes before merging.
